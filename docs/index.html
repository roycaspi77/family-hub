<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Hub</title>
<meta name="theme-color" content="#2563eb">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Hub">
<script src="config.js"></script>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e3e6ea;
          --accent:#2563eb; --ok:#15803d; --warn:#b45309; --bad:#dc2626;
          --yellow:#facc15; --red:#dc2626; --gold:#d97706; --wa:#16a34a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1b2027; --ink:#e8eaed; --muted:#9aa3ad; --line:#2b323b;
            --accent:#60a5fa; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --gold:#fbbf24; --wa:#4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); padding-bottom:76px; }
  header { position:sticky; top:0; z-index:2; background:var(--card); border-bottom:1px solid var(--line);
           padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
  main { padding:12px 16px; max-width:640px; margin:0 auto; }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:18px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .card.yellow { border-left:5px solid var(--yellow); }
  .card.red { border-left:5px solid var(--red); }
  .card.good { border-left:5px solid var(--gold); }
  .card.offer { border:2px solid var(--accent); }
  .card.dim { opacity:.6; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .muted { color:var(--muted); font-size:14px; }
  .title { font-weight:600; }
  .chip { display:inline-block; padding:2px 9px; margin:2px 4px 2px 0; border-radius:999px; font-size:13px; border:1px solid var(--line); }
  .chip.extra { border-color:var(--accent); color:var(--accent); }
  .chip.now { background:var(--accent); border-color:var(--accent); color:#fff; }
  .overdue { color:var(--bad); } .soon { color:var(--warn); } .ok { color:var(--ok); }
  .btn { border:0; border-radius:10px; padding:9px 14px; font-size:15px; background:var(--accent); color:#fff;
         cursor:pointer; text-decoration:none; white-space:nowrap; display:inline-block; }
  .btn.go { background:var(--ok); }
  .btn.sec { background:transparent; color:var(--accent); border:1px solid var(--line); }
  .btn.small { padding:5px 10px; font-size:13px; }
  .btn.wa { color:var(--wa); border-color:var(--wa); background:transparent; }
  .btn.icon { padding:4px 9px; }
  .btn:disabled { opacity:.5; }
  input, select, textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
                            background:var(--bg); color:var(--ink); font:inherit; }
  input[type=checkbox] { width:auto; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  .check { display:flex; gap:8px; align-items:center; color:var(--ink); font-size:15px; margin:6px 0; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .notice { border-radius:8px; padding:8px 10px; margin-top:10px; background:var(--bg); border:1px solid var(--line); }
  .line { list-style:none; margin:6px 0 0; padding:0; }
  .line li { display:flex; align-items:center; gap:6px; padding:5px 0; border-bottom:1px dashed var(--line); }
  .line li .n { width:22px; color:var(--muted); font-size:13px; }
  .line li .who { flex:1; }
  table.sum { width:100%; border-collapse:collapse; }
  table.sum td { padding:6px 4px; border-bottom:1px solid var(--line); }
  table.sum td.n { text-align:center; width:64px; }
  .dots { letter-spacing:2px; }
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--line); }
  nav button { flex:1; border:0; background:none; padding:8px 0 12px; font-size:12px; color:var(--muted); cursor:pointer; }
  nav button.on { color:var(--accent); font-weight:600; }
  nav .ic { display:block; font-size:20px; }
  .badge { background:var(--bad); color:#fff; border-radius:999px; font-size:11px; padding:0 6px; margin-left:2px; }
  .badge.n { background:var(--muted); }
  #toast { position:fixed; left:16px; right:16px; bottom:84px; background:#222; color:#fff; padding:10px 14px;
           border-radius:10px; display:none; z-index:5; }
  #toast button { margin-left:12px; background:none; border:1px solid #fff; color:#fff; border-radius:8px; padding:2px 12px; font:inherit; }
  /* Supermarket */
  .addrow { display:flex; gap:8px; align-items:center; }
  .addrow input { flex:1; min-width:0; }
  .addrow select { width:auto; max-width:50%; }
  .gcat { font-size:13px; font-weight:600; color:var(--muted); margin:12px 0 2px; }
  .gcat:first-child { margin-top:0; }
  .gi { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
  .gcat + .gi, .gi:first-child { border-top:0; }
  .gi .gn { flex:1; min-width:0; cursor:pointer; overflow-wrap:anywhere; }
  .gi.done .gn bdi:first-child { text-decoration:line-through; color:var(--muted); }
  .ck { width:30px; height:30px; flex-shrink:0; border-radius:50%; border:2px solid var(--muted); background:none;
        color:#fff; font-size:16px; line-height:1; cursor:pointer; padding:0; }
  .gi.done .ck { border-color:var(--ok); background:var(--ok); }
  .tag-urgent { color:var(--bad); font-size:13px; font-weight:600; white-space:nowrap; }
  button.chip { font:inherit; font-size:14px; background:var(--card); color:var(--ink); cursor:pointer; padding:4px 11px; }
  .chip.low { border-color:var(--warn); }
  .chip .x { border:0; background:none; color:var(--muted); cursor:pointer; padding:0 0 0 6px; font:inherit; }
  details summary { cursor:pointer; color:var(--muted); font-size:14px; margin-top:12px; }
</style>
</head>
<body>
<header><strong>🏠 Family Hub</strong><span id="who" class="muted"></span></header>
<main id="view"><p class="muted">Loading…</p></main>
<nav id="nav"></nav>
<div id="toast"></div>

<script>
let TOKEN = '', S = null, TAB = 'tasks', EDITING = false;
// Supermarket: GPENDING = shopping-list calls still in flight (their changes are already shown),
// VER = bumped on each such change so an older auto-refresh can't paint stale data over it.
let GPENDING = 0, VER = 0, LAST_LOAD = 0;
const $ = sel => document.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
// A slot is one name ("Noa") or a group ("Dad+Noa").
const who = slot => String(slot || '').split('+').map(s => s.trim()).filter(Boolean).join(' & ');

// text/plain keeps this a "simple" request, so Apps Script needs no CORS preflight.
function call(fn, ...args) {
  return fetch(window.FAMILY_HUB_API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: [TOKEN, ...args] }),
  })
    .then(r => r.json())
    .then(res => { if (!res.ok) throw new Error(res.error); return res.data; })
    .catch(e => { toast(e.message === 'Failed to fetch' ? 'No connection to the server' : e.message); throw e; });
}
function toast(msg, undo) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  if (undo) {
    const b = document.createElement('button'); b.textContent = 'Undo';
    b.onclick = () => { t.style.display = 'none'; undo(); };
    t.appendChild(b);
  }
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = 'none', undo ? 6000 : 3500);
}
function update(state) {
  EDITING = false;
  // An older backend answers in an older format; say so instead of hanging on "Loading…".
  if (!state || !state.rotating || !state.dates) {
    $('#view').innerHTML = '<div class="card">⚠️ The app was updated but its Google backend is still the old version.<br>' +
      'An admin needs to open Apps Script → <b>Deploy → Manage deployments → ✏️ Edit → New version → Deploy</b>.</div>';
    return;
  }
  S = state;
  try { render(); } catch (e) {
    $('#view').innerHTML = `<div class="card">⚠️ Something went wrong showing the app: ${esc(e.message)}</div>`;
  }
}
function load() {
  if (EDITING || GPENDING) return;
  const v = VER;
  LAST_LOAD = Date.now();
  call('getState').then(s => {
    // Don't paint over a form the user opened, or over a newer list change, meanwhile.
    if (!S || (v === VER && !GPENDING && !EDITING)) update(s);
  }).catch(() => {
    if (!S) $('#view').innerHTML = '<div class="card">Could not load. Make sure you opened your personal link.</div>';
  });
}

// ---------- formatting ----------
function when(ms) {
  if (!ms) return '';
  const d = new Date(ms);
  return d.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'numeric' }) + ' ' +
         d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
}
const day = ms => new Date(ms).toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });
function rel(ms) {
  const diff = ms - Date.now(), abs = Math.abs(diff), h = abs / 3600000;
  const txt = h < 1 ? Math.round(abs / 60000) + ' min' : h < 48 ? Math.round(h) + ' h' : Math.round(h / 24) + ' days';
  return diff < 0 ? txt + ' ago' : 'in ' + txt;
}
function dueClass(ms) { const d = ms - Date.now(); return d < 0 ? 'overdue' : d < 3 * 3600000 ? 'soon' : ''; }
function toInput(ms) { const d = new Date(ms); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); }
function tonight9pm() {
  const d = new Date(); d.setHours(21, 0, 0, 0);
  if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);  // already past 21:00 → tomorrow
  return d.getTime();
}
/** The next two 1st-of-month dates (today counts if it is the 1st). */
function nextPaydays() {
  const now = new Date();
  const first = now.getDate() === 1 ? new Date(now.getFullYear(), now.getMonth(), 1)
                                    : new Date(now.getFullYear(), now.getMonth() + 1, 1);
  return [first, new Date(first.getFullYear(), first.getMonth() + 1, 1)];
}
const shekel = n => '₪' + Number(n).toLocaleString();
const STATUS = { done:'✅ Done', missed:'❌ Missed', excused:'⏭️ Skipped', cancelled:'🚫 Cancelled' };
const isMine = t => t.members.indexOf(S.me.name) >= 0;
const memberOptions = (exclude, selected) => S.users.filter(u => u.name !== exclude)
  .map(u => `<option ${u.name === selected ? 'selected' : ''}>${esc(u.name)}</option>`).join('');
const activeRotating = () => S.rotating.filter(a => a.active);
const openTasks = () => activeRotating().filter(a => a.current).map(a => a.current).concat(S.oneTime);

// ---------- WhatsApp click-to-chat ----------
/**
 * Opens WhatsApp with the text already written and no recipient: WhatsApp asks
 * which chat, so it goes to the family group. (A link can't open a specific
 * group, so this one tap to pick it is the minimum.) No direct-to-member buttons.
 */
const waBtn = (text, label) =>
  `<a class="btn small wa" href="${esc('https://wa.me/?text=' + encodeURIComponent(text))}" target="_blank" rel="noopener">💬 ${esc(label)}</a>`;
/** A predefined message for a member or a slot ("Dad & Noa"), sent to the group. */
const waBtns = (slot, textFor, label) => waBtn(textFor(who(slot)), label);

const MSG = {
  rotating: (n, t) => `Hi ${n}, it's your turn for "${t.title}" 🧹 When you finish, press Done in Family Hub.`,
  oneTime: (n, t) => `Hi ${n}, a reminder: "${t.title}" is due ${when(t.due_at)} 🧹 When you finish, press Done in Family Hub.`,
  date: (n, t) => `Hi ${n}, a reminder: "${t.title}" — ${when(t.due_at)}${t.place ? ' at ' + t.place : ''} 🎉`,
  warning: n => {
    const s = S.cards.summary.find(c => c.name === n);
    return s && s.yellow
      ? `⚠️ ${n}, this is a warning. You already have a yellow card — the next one becomes a red card 🟥`
      : `⚠️ ${n}, this is a warning. Next time you'll get a yellow card 🟨`;
  },
  card: c => c.color === 'red'
    ? `🟥 ${c.member}, this is a red card (two yellow cards): ${c.explanation}. Penalty: an extra turn in "${c.red_task}".`
    : `🟨 ${c.member}, you got a yellow card: ${c.explanation}. A second yellow card becomes a red card.`,
  goodWord: g => `🌟 ${g.member}, a good word for you: ${g.explanation}` +
    (g.prize ? `\n🎁 That's ${S.goodWords.perPrize} good words — your prize: ${g.prize}` : ''),
  reward: r => `🏆 ${r.member} collected ${S.stars.perReward} ⭐ — reward time! 🎁` +
    (r.reward > 1 ? ` (reward #${r.reward})` : ''),
  nudge: t => `Hi ${t.offer_to}, I asked you in Family Hub to ${t.offer_kind === 'switch' ? 'switch turns with me for' : 'take'} "${t.title}". Can you accept it in the app? 🙏`,
  going: () => `🛒 I'm going to the supermarket soon. Need anything? Add it to the shopping list in Family Hub 👉 ${location.origin + location.pathname}`,
  list: groups => '🛒 Shopping list\n' + groups.map(([cat, items]) => `\n${cat || 'Not sorted'}\n` +
    items.map(i => `• ${i.name}${i.qty ? ' – ' + i.qty : ''}${i.urgent ? ' ⚡' : ''}`).join('\n')).join('\n'),
};
const remindBtns = t => waBtns(t.assignee, n => t.rotating ? MSG.rotating(n, t) : MSG.oneTime(n, t), 'Remind');

// ---------- shell ----------
function render() {
  $('#who').textContent = S.me.name + (S.me.isAdmin ? ' · admin' : '');
  const mine = openTasks().filter(isMine).length + S.offers.length;
  const g = S.groceries;
  const onList = g ? g.items.filter(i => i.status === 'needed').length : 0;
  const wishes = g && S.me.isAdmin ? g.items.filter(i => i.status === 'wish').length : 0;
  const tabs = [['tasks','🧹','Tasks', mine], ['shop','🛒','Shopping', wishes, onList], ['cards','🟨','Cards'], ['fun','🎉','Fun Stuff']];
  if (S.me.isAdmin) tabs.push(['admin','⚙️','Admin', S.replaceRequests.length]);
  $('#nav').innerHTML = tabs.map(([id, ic, label, n, count]) =>
    `<button class="${TAB === id ? 'on' : ''}" onclick="go('${id}')"><span class="ic">${ic}</span>${label}` +
    `${count ? `<span class="badge n">${count}</span>` : ''}${n ? `<span class="badge">${n}</span>` : ''}</button>`).join('');
  // Auto-refresh redraws the screen: keep the cursor in the field the user is typing in.
  const a = document.activeElement;
  const keep = a && a.id && /^(INPUT|TEXTAREA)$/.test(a.tagName) ? { id: a.id, at: a.selectionStart } : null;
  $('#view').innerHTML = VIEWS[TAB]();
  const el = keep && document.getElementById(keep.id);
  if (el) { el.focus(); try { el.setSelectionRange(keep.at, keep.at); } catch (e) {} }
}
function go(tab) { TAB = tab; EDITING = false; render(); window.scrollTo(0, 0); }

function taskCard(t) {
  const mine = isMine(t);
  let state = '';
  let buttons = '';
  if (t.offer_to) {
    state = `🔄 Waiting for ${esc(t.offer_to)} to ${t.offer_kind === 'switch' ? 'switch' : 'take it'}`;
    if (t.offer_by === S.me.name) {
      buttons += `<button class="btn sec small" onclick="answerOffer('${t.id}', false, this)">Withdraw</button>` + waBtn(MSG.nudge(t), 'Nudge');
    }
  } else if (t.replace_request === 'pending') {
    state = '🙋 Asked the admins for a replacement';
    if (mine) buttons += `<button class="btn sec small" onclick="withdrawReplace('${t.id}', this)">Withdraw</button>`;
  } else if (mine) {
    buttons += `<button class="btn sec small" onclick="offerForm('${t.id}', 'pass')">Pass to…</button>`
      + (t.rotating ? `<button class="btn sec small" onclick="offerForm('${t.id}', 'switch')">Switch with…</button>` : '')
      + `<button class="btn sec small" onclick="replaceForm('${t.id}')">Ask to be replaced</button>`;
  }
  if (t.replace_request === 'declined' && mine) state = state || 'The admins declined your replacement request';
  const done = mine || S.me.isAdmin ? doneRow(t) : '';
  return `<div class="card">
    <div class="row"><span class="title">${t.rotating ? '🔁' : '📌'} ${esc(t.title)}</span><span class="muted">${esc(who(t.assignee))}</span></div>
    ${t.rotating ? '' : `<div class="${dueClass(t.due_at)}">Due ${when(t.due_at)} · ${rel(t.due_at)}</div>`}
    ${state ? `<div class="muted">${state}</div>` : ''}
    ${done}
    ${buttons ? `<div class="actions">${buttons}</div>` : ''}
  </div>`;
}

/** Note box + Done button. Admins also get it on other members' turns (marks it done for them). */
function doneRow(t) {
  const forOther = !isMine(t);
  return `<div class="actions"><input id="note-${t.id}" placeholder="Note (optional)" style="flex:1;min-width:120px">
      <button class="btn go" onclick="complete('${t.id}', this)">✓ Done${forOther ? ' for ' + esc(who(t.assignee)) : ''}</button></div>`;
}

function lineChips(a) {
  return (a.current ? `<span class="chip now">${esc(who(a.current.assignee))}</span>` : '') +
    a.upcoming.map(u => `<span class="chip ${u.extra ? 'extra' : ''}" title="${u.extra ? 'Extra turn' : ''}">${esc(who(u.name))}${u.extra ? ' ➕' : ''}</span>`).join('');
}

function dateCard(t, past) {
  return `<div class="card ${past ? 'dim' : ''}">
    <div class="row"><span class="title">🎉 ${esc(t.title)}</span><span class="muted">${esc(who(t.assignee))}</span></div>
    <div>${when(t.due_at)}${past ? '' : ' · ' + rel(t.due_at)}</div>
    ${t.place ? `<div class="muted">📍 ${esc(t.place)}</div>` : ''}
    ${S.me.isAdmin && !past ? `<div class="actions">${waBtns(t.assignee, n => MSG.date(n, t), 'Remind')}
      <button class="btn sec small" onclick="dateForm('${t.id}')">Edit</button>
      <button class="btn sec small" onclick="deleteDate('${t.id}', this)">Delete</button></div>` : ''}
  </div>`;
}

function cardItem(c) {
  const icon = c.color === 'red' ? '🟥' : '🟨';
  return `<div class="card ${c.color} ${c.color === 'yellow' && c.used ? 'dim' : ''}">
    <div class="row"><span class="title">${icon} ${esc(c.member)}</span><span class="muted">${day(c.created_at)}</span></div>
    <div>${esc(c.explanation)}</div>
    <div class="muted">${c.task ? 'About: ' + esc(c.task) + ' · ' : ''}${c.color === 'red' ? 'Extra turn in: <b>' + esc(c.red_task) + '</b> · ' : ''}${c.color === 'yellow' && c.used ? 'became part of a red card · ' : ''}by ${esc(c.by)}</div>
    ${S.me.isAdmin ? `<div class="actions">${waBtn(MSG.card(c), 'Send')}</div>` : ''}
  </div>`;
}

function goodItem(g) {
  return `<div class="card good">
    <div class="row"><span class="title">🌟 ${esc(g.member)}</span><span class="muted">${day(g.created_at)}</span></div>
    <div>${esc(g.explanation)}</div>
    ${g.prize ? `<div style="margin-top:4px">🎁 <b>Prize:</b> ${esc(g.prize)}</div>` : ''}
    <div class="muted">by ${esc(g.by)}</div>
    ${S.me.isAdmin ? `<div class="actions">${waBtn(MSG.goodWord(g), 'Send')}</div>` : ''}
  </div>`;
}

function rewardItem(r) {
  return `<div class="card good">
    <div class="row"><span class="title">🏆 ${esc(r.member)} · reward #${r.reward}</span><span class="muted">${day(r.created_at)}</span></div>
    <div class="muted">${S.stars.perReward} ⭐ — the last one ${r.manual ? `from ${esc(r.by)}${r.task ? ': “' + esc(r.task) + '”' : ''}` : `for “${esc(r.task)}”`}</div>
    ${S.me.isAdmin ? `<div class="actions">${waBtn(MSG.reward(r), 'Announce the reward')}</div>` : ''}
  </div>`;
}

// ---------- views ----------
const VIEWS = {
  tasks() {
    const all = openTasks();
    const mine = all.filter(isMine);
    const otherOneTime = S.oneTime.filter(t => !isMine(t)).sort((a, b) => a.due_at - b.due_at);
    const offers = S.offers.map(t => `<div class="card offer">
      <div class="title">🔄 ${esc(t.offer_by)} asks you to take “${esc(t.title)}”</div>
      ${t.rotating ? '' : `<div class="${dueClass(t.due_at)}">Due ${when(t.due_at)}</div>`}
      <div class="muted">${t.offer_kind === 'switch' ? `Switch: you do this turn now, and ${esc(t.offer_by)} does your next “${esc(t.title)}” turn.` : 'Pass: you take it, nothing in return.'}</div>
      <div class="actions"><button class="btn go" onclick="answerOffer('${t.id}', true, this)">Accept</button>
        <button class="btn sec" onclick="answerOffer('${t.id}', false, this)">Decline</button></div></div>`).join('');
    const rotations = activeRotating().map(a => `<div class="card">
      <div class="title">🔁 ${esc(a.name)}</div><div style="margin-top:4px">${lineChips(a)}</div>
      ${S.me.isAdmin && a.current && !isMine(a.current) ? doneRow(a.current) : ''}</div>`).join('');
    const history = S.history.map(t => `<div class="card">
      <div class="row"><span class="title">${esc(t.title)}</span>
        <span class="${t.status === 'done' ? 'ok' : 'muted'}">${STATUS[t.status] || esc(t.status)}</span></div>
      <div class="muted">${esc(who(t.assignee))} · ${t.completed_at ? when(t.completed_at) : ''}${t.completed_by && !t.members.includes(t.completed_by)
        ? ' · by ' + esc(t.completed_by) : t.status === 'done' && t.completed_by ? ' · ⭐ ' + esc(t.completed_by) : ''}</div>

    return (offers ? '<h2>Requests for you</h2>' + offers : '') +
      '<h2>My tasks</h2>' + (mine.length ? mine.map(taskCard).join('') : '<div class="card muted">Nothing for you right now 🎉</div>') +

  },
  shop() {
    const g = S.groceries;
    if (!g) return '<div class="card">⚠️ The shopping list needs the new Google backend. An admin needs to paste the new Code.gs, run <b>setup</b>, and deploy a new version.</div>';
    GREFS = [];
    const cart = g.items.filter(i => i.status === 'checked');
    const wishes = g.items.filter(i => i.status === 'wish');
    const declined = g.items.filter(i => i.status === 'declined');
    const groups = neededGroups();
    const count = groups.reduce((n, gr) => n + gr[1].length, 0);
    const low = lowSuggestions();
    const usual = usuals(low);

    const addCard = `<div class="card">
      <div class="addrow"><input id="g_name" list="g_names" dir="auto" autocomplete="off" enterkeyhint="done"
          placeholder="What do we need? (apples, milk…)" value="${esc(DRAFT.name)}"

        <button class="btn go" onclick="addGrocery()">Add</button></div>
      <div class="addrow" style="margin-top:8px"><input id="g_qty" dir="auto" placeholder="How much? (optional)" value="${esc(DRAFT.qty)}"
          oninput="DRAFT.qty=this.value" onkeydown="if(event.key==='Enter')addGrocery()">
        <select id="g_cat" onchange="DRAFT.cat=this.value;groceryHint()"><option value="auto">Auto category</option>
          ${g.categories.map(c => `<option ${DRAFT.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
      <label class="check"><input id="g_urgent" type="checkbox" ${DRAFT.urgent ? 'checked' : ''} onchange="DRAFT.urgent=this.checked"> ⚡ Urgent: we're out of it</label>
      <div id="g_hint" class="muted">${hintHtml()}</div>
      <datalist id="g_names">${g.catalog.map(c => `<option value="${esc(c.name)}">`).join('')}</datalist>
      ${low.length ? `<div class="muted" style="margin-top:10px">🔔 Running low? Tap to add</div><div>${low.map(l => `<span class="chip low">
          <button class="x" style="padding:0;color:var(--ink)" onclick="quickAdd(${gref(l.c.key)})">+ <bdi>${esc(l.c.name)}</bdi></button>
          <span class="muted">${Math.round(l.since)}d</span>
          <button class="x" title="Not needed now" onclick="snooze(${gref(l.c.key)})">✕</button></span>`).join('')}</div>` : ''}
      <details ${DRAFT.usualsOpen ? 'open' : ''} ontoggle="DRAFT.usualsOpen=this.open"><summary>⭐ Our usuals</summary>
        <div style="margin-top:6px">${usual.length
          ? usual.map(c => `<button class="chip" onclick="quickAdd(${gref(c.key)})">+ <bdi>${esc(c.name)}</bdi></button>`).join('')

    </div>`;

    const wishCard = wishes.length ? '<h2>🙋 Wishes · waiting for a parent\'s OK</h2><div class="card">' + wishes.map(i => `<div class="gi">
        <div class="gn"><bdi>${esc(i.name)}</bdi>${i.qty ? ` · <bdi>${esc(i.qty)}</bdi>` : ''}<div class="muted">${esc(i.added_by)} · ${rel(i.added_at)}</div></div>
        ${S.me.isAdmin ? `<button class="btn go small" ${tmpAttr(i)} onclick="answerWish('${i.id}', true)">OK</button>
          <button class="btn sec small" ${tmpAttr(i)} onclick="answerWish('${i.id}', false)">Not now</button>`
        : i.added_by === S.me.name ? `<button class="btn sec small icon" title="Delete" ${tmpAttr(i)} onclick="deleteItem('${i.id}')">🗑</button>` : ''}
      </div>`).join('') + '</div>' : '';

    const list = count
      ? '<div class="card">' + groups.map(([cat, items]) => `<div class="gcat">${esc(cat || 'Not sorted')}</div>` + items.map(itemRow).join('')).join('') + '</div>'
      : '<div class="card muted">The list is empty 🎉 Took the last of something? Add it above.</div>';

    const cartCard = cart.length ? `<h2>In the cart · ${cart.length}</h2><div class="card">${cart.map(itemRow).join('')}
        <div class="actions"><button class="btn go" onclick="finishShopping(this)">✓ Finish shopping</button></div>
        <div class="muted" style="margin-top:6px">Marks the crossed-out items as bought. Anything not crossed out stays on the list.</div></div>` : '';

    return addCard + wishCard +
      `<h2>Shopping list${count ? ' · ' + count : ''}</h2>
      <div class="actions" style="margin:0 0 10px">${waBtn(MSG.going(), "I'm going shopping")}${count ? waBtn(MSG.list(groups), 'Send the list') : ''}</div>` +
      list + cartCard +
      (declined.length ? `<div class="muted" style="margin-top:12px">Not this time: ${declined.map(i => `<bdi>${esc(i.name)}</bdi> (${esc(i.added_by)})`).join(', ')}</div>` : '');
  },
  cards() {
    return '<h2>Cards</h2><div class="card"><table class="sum"><tr><td></td><td class="n muted">🟨 now</td><td class="n muted">🟥 total</td>' +
        (S.me.isAdmin ? '<td></td>' : '') + '</tr>' +

          (S.me.isAdmin ? `<td style="text-align:right">${waBtn(MSG.warning(c.name), 'Warn')}</td>` : '') + '</tr>').join('') +
        '</table><div class="muted" style="margin-top:8px">A second yellow card becomes a red card, which means an extra turn in a task.</div></div>' +
      '<h2>All cards</h2>' + (S.cards.list.map(cardItem).join('') || '<div class="card muted">No cards yet 👏</div>');
  },
  fun() {
    const per = S.goodWords.perPrize;
    const paydays = nextPaydays();
    const st = S.stars;
    const stars = !st ? '' : '<h2>Stars</h2><div class="card"><table class="sum"><tr><td></td><td class="muted">⭐ now</td><td class="n muted">🏆 rewards</td>' +
        (S.me.isAdmin ? '<td></td>' : '') + '</tr>' +
        st.summary.map(s => `<tr><td>${esc(s.name)}</td>
          <td class="dots" title="${s.now} of ${st.perReward}">${'★'.repeat(s.now)}${'☆'.repeat(st.perReward - s.now)}</td><td class="n">${s.rewards}</td>` +
          (S.me.isAdmin ? `<td style="text-align:right"><button class="btn sec small" title="Give ${esc(s.name)} a star" onclick="giveStar(S.stars.summary[${st.summary.indexOf(s)}].name)">+⭐</button></td>` : '') +
          '</tr>').join('') +
        `</table><div class="muted" style="margin-top:8px">Press Done on your own task to get a ⭐ (not when a parent marks it for you). Parents can also give a ⭐. Every ${st.perReward} ⭐ earn a reward 🏆</div></div>` +
        st.rewards.map(rewardItem).join('');
    return '<h2>Coming dates</h2>' + (S.dates.upcoming.map(t => dateCard(t, false)).join('') || '<div class="card muted">Nothing planned yet.</div>') +
      stars +
      '<h2>Good words</h2><div class="card"><table class="sum">' +
        S.goodWords.summary.map(g => { const p = g.count % per; return `<tr><td>${esc(g.name)}</td>
          <td class="n">🌟 ${g.count}</td><td class="dots">${'★'.repeat(p)}${'☆'.repeat(per - p)}</td></tr>`; }).join('') +
        `</table><div class="muted" style="margin-top:8px">Every ${per} good words earn a prize 🎁</div></div>` +
        S.goodWords.list.map(goodItem).join('') +
      '<h2>Allowance</h2>' + (S.allowance.filter(a => a.amount > 0 || !S.me.isAdmin).map(a => `<div class="card">
        <div class="row"><span class="title">💰 ${esc(a.name)}</span><span class="title">${shekel(a.amount)} / month</span></div>
        ${paydays.map(d => `<div class="row muted"><span>${day(d.getTime())}</span><span>${shekel(a.amount)}</span></div>`).join('')}
      </div>`).join('') || '<div class="card muted">No allowance set.</div>') +
      (S.dates.past.length ? '<h2>Past dates</h2>' + S.dates.past.map(t => dateCard(t, true)).join('') : '');
  },
  admin() {
    const replace = S.replaceRequests.map(t => `<div class="card offer">
      <div class="row"><span class="title">🙋 ${esc(who(t.assignee))} asks to be replaced</span></div>
      <div>${t.rotating ? '🔁' : '📌'} ${esc(t.title)}${t.rotating ? '' : ' · due ' + when(t.due_at)}</div>
      ${t.replace_reason ? `<div class="muted">“${esc(t.replace_reason)}”</div>` : ''}
      <label>Replace with</label><select id="rep-${t.id}">${memberOptions(t.members[0])}</select>
      <div class="actions"><button class="btn" onclick="answerReplace('${t.id}', val('rep-${t.id}'), this)">Replace</button>
        <button class="btn sec" onclick="answerReplace('${t.id}', '', this)">Decline</button></div></div>`).join('');
    const rotating = S.rotating.map(a => {
      const c = a.current;
      return `<div class="card">
        <div class="row"><span class="title">🔁 ${esc(a.name)}${a.active ? '' : ' <span class="muted">(inactive)</span>'}</span>
          <button class="btn sec small" onclick="rotatingForm('${a.id}')">Edit</button></div>
        <div class="muted">Rotation: ${esc(a.rotation.split(', ').map(who).join(' → '))}</div>
        ${c ? `<div style="margin-top:8px">Now: <b>${esc(who(c.assignee))}</b></div>
          <div class="actions">${remindBtns(c)}
            <button class="btn sec small" onclick="reassignForm('${c.id}')">Reassign</button>
            <button class="btn sec small" onclick="skipTurn('${c.id}', this)">Skip turn</button></div>` : ''}
        ${a.active ? `<div class="muted" style="margin-top:10px">Coming up${a.changed ? ' (changed — returns to the normal order afterwards)' : ''}:</div>
          <ul class="line">${a.upcoming.map((u, i) => `<li><span class="n">${i + 1}.</span>
            <span class="who">${esc(who(u.name))}${u.extra ? ' <span class="chip extra">➕ extra</span>' : ''}</span>
            <button class="btn sec small icon" title="Earlier" ${i === 0 ? 'disabled' : ''} onclick="moveTurn('${a.id}', ${i}, -1, this)">↑</button>
            <button class="btn sec small icon" title="Later" onclick="moveTurn('${a.id}', ${i}, 1, this)">↓</button>
            ${u.extra ? `<button class="btn sec small icon" title="Remove extra turn" onclick="removeTurn('${a.id}', ${i}, this)">✕</button>` : ''}
          </li>`).join('')}</ul>
          <div class="actions"><button class="btn small" onclick="insertForm('${a.id}')">➕ Add a turn</button>
            ${a.changed ? `<button class="btn sec small" onclick="resetOrder('${a.id}', this)">Back to normal order</button>` : ''}</div>` : ''}
      </div>`;
    }).join('');
    const oneTime = S.oneTime.slice().sort((a, b) => a.due_at - b.due_at).map(t => `<div class="card">
      <div class="row"><span class="title">📌 ${esc(t.title)}</span><span class="muted">${esc(who(t.assignee))}</span></div>
      <div class="${dueClass(t.due_at)}">Due ${when(t.due_at)} · ${rel(t.due_at)}</div>
      <div class="actions">${remindBtns(t)}
        <button class="btn sec small" onclick="oneTimeForm('${t.id}')">Edit</button>
        <button class="btn sec small" onclick="skipTurn('${t.id}', this)">Cancel task</button></div></div>`).join('');
    return (replace ? '<h2>Replacement requests</h2>' + replace : '') +
      `<div class="actions" style="margin-top:${replace ? 18 : 0}px">
        <button class="btn" onclick="rotatingForm()">+ Rotating task</button>
        <button class="btn" onclick="oneTimeForm()">+ One-time task</button>
        <button class="btn" onclick="dateForm()">+ Date</button></div>
      <div class="actions">
        <button class="btn sec" onclick="giveCard()">🟨 Yellow card</button>
        <button class="btn sec" onclick="giveGoodWord()">🌟 Good word</button>
        ${S.stars ? '<button class="btn sec" onclick="giveStar()">⭐ Star</button>' : ''}
        <button class="btn sec" onclick="editUser()">+ Add member</button>
        <button class="btn sec" onclick="showLinks()">Personal links</button>
        ${S.groceries ? '<button class="btn sec" onclick="grocerySettingsForm()">🛒 Shopping categories</button>' : ''}</div>` +
      '<h2>Rotating tasks</h2>' + (rotating || '<div class="card muted">None yet.</div>') +
      '<h2>One-time tasks</h2>' + (oneTime || '<div class="card muted">None open.</div>') +
      '<h2>Family</h2>' + S.users.map((u, i) => `<div class="card row"><div><span class="title">${esc(u.name)}</span>
          <span class="muted">${esc(u.role)} · ${shekel(u.allowance)}/month</span></div>
        <span class="actions" style="margin-top:0;flex-shrink:0">
        <button class="btn sec small" onclick="editUser(S.users[${i}].name)">Edit</button></span></div>`).join('');
  },
};

// ---------- actions ----------
function busy(btn) { if (btn) btn.disabled = true; }
function act(btn, promise, msg) { busy(btn); promise.then(s => { if (msg) toast(msg); update(s); }).catch(() => { if (btn) btn.disabled = false; }); }
function complete(id, btn) {
  busy(btn);
  call('completeTurn', id, $('#note-' + id).value)
    .then(s => { starToast(s.star); update(s); })
    .catch(() => { if (btn) btn.disabled = false; });
}
function answerOffer(id, accept, btn) { act(btn, call('answerOffer', id, accept), accept ? 'It\'s yours now' : 'Done'); }
function withdrawReplace(id, btn) { act(btn, call('requestReplace', id, '', true)); }
function answerReplace(id, member, btn) { act(btn, call('adminAnswerReplace', id, member), member ? 'Replaced' : 'Declined'); }
function skipTurn(id, btn) { if (confirm('Are you sure?')) act(btn, call('adminSkipTurn', id)); }
function moveTurn(aid, i, dir, btn) { act(btn, call('adminMoveTurn', aid, i, dir)); }
function removeTurn(aid, i, btn) { act(btn, call('adminRemoveTurn', aid, i)); }
function resetOrder(aid, btn) { if (confirm('Remove all extra turns and changes, and go back to the normal order?')) act(btn, call('adminResetOrder', aid)); }
function deleteDate(id, btn) { if (confirm('Delete this date?')) act(btn, call('adminDeleteDate', id)); }

function form(title, body, onSave) {
  EDITING = true;
  $('#view').innerHTML = `<h2>${title}</h2><div class="card">${body}
    <div class="actions"><button class="btn" id="saveBtn">Save</button><button class="btn sec" onclick="go(TAB)">Cancel</button></div></div>`;
  $('#saveBtn').onclick = () => { busy($('#saveBtn')); onSave().then(update).catch(() => $('#saveBtn').disabled = false); };
  window.scrollTo(0, 0);
}
const val = id => $('#' + id).value;
const chk = id => $('#' + id).checked;
const msOf = id => new Date(val(id)).getTime();
const findTask = id => openTasks().find(x => x.id === id);

// ---------- member forms ----------
function offerForm(id, kind) {
  const t = findTask(id);
  form((kind === 'switch' ? 'Switch: ' : 'Pass: ') + esc(t.title), `
    <div class="muted">${kind === 'switch'
      ? 'They do this turn now, and you do their next “' + esc(t.title) + '” turn.'
      : 'They take this turn. Nothing in return.'} They have to accept it in the app.</div>
    <label>Ask</label><select id="o_to">${memberOptions(S.me.name)}</select>`,
    () => call('offerTurn', id, val('o_to'), kind));
}

function replaceForm(id) {
  const t = findTask(id);
  form('Ask to be replaced: ' + esc(t.title), `
    <div class="muted">The admins will see your request and can pick someone else for this turn.</div>
    <label>Why? (optional)</label><textarea id="r_reason" rows="3" maxlength="200"></textarea>`,
    () => call('requestReplace', id, val('r_reason'), false));
}

function insertForm(aid) {

    <label>For</label><select id="g_who" onchange="goodPrizeNotice()">${memberOptions('')}</select>
    <label>What for (everyone will see this)</label><textarea id="g_why" rows="3" maxlength="300"></textarea>

function giveStar(name) {

function starNotice() {
  const s = S.stars.summary.find(x => x.name === val('s_who'));
  const next = (s ? s.now : 0) + 1;
  $('#s_note').innerHTML = `<div class="muted" style="margin-top:8px">This will be ⭐ ${next} of ${S.stars.perReward}` +
    (next === S.stars.perReward ? ' — it completes a 🏆 reward!' : '') + '</div>';
}
/** Mine: "Nice! ⭐ 3 of 10"; given by an admin: "⭐ Noa: 3 of 10". */
function starToast(st) {
  if (!st) return toast('Done ✓');
  const mine = st.member === S.me.name;
  toast(st.reward ? `🏆 ${mine ? 'You' : st.member} earned a reward (${st.per} stars)! The count starts again.`
    : mine ? `Nice! ⭐ ${st.count} of ${st.per}` : `⭐ ${st.member}: ${st.count} of ${st.per}`);
}
function goodPrizeNotice() {
  const g = S.goodWords.summary.find(x => x.name === val('g_who'));
  const next = (g ? g.count : 0) + 1;
  $('#g_prize').innerHTML = next % S.goodWords.perPrize === 0 ? `<div class="notice">🎁 This is good word #${next} — it comes with a prize.
      <label>Prize</label><input id="g_prizeval" placeholder="Pizza night of your choice"></div>` : '';
}

function editUser(name) {
  const u = S.users.find(x => x.name === name) || { name:'', email:'', role:'member', allowance:0 };
  form(name ? 'Edit ' + esc(name) : 'Add member', `
    ${name ? '' : '<label>Name (used in rotations, cannot be changed later)</label><input id="u_name">'}
    <label>Role</label><select id="u_role"><option value="member">Member</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option></select>
    <label>Monthly allowance (₪, paid on the 1st)</label><input id="u_allow" type="number" min="0" step="1" value="${u.allowance}">
    <label>Email (optional)</label><input id="u_email" type="email" value="${esc(u.email)}">`,
    () => call('adminSaveUser', {
      existing: name || '', name: name ? name : val('u_name'), role: val('u_role'), email: val('u_email'),
      allowance: val('u_allow'),
    }));
}

/** Opens the phone's share sheet with that member's link; falls back to copying it. */
let LINKS = [];
function shareLink(i) {
  const l = LINKS[i];
  const text = `${l.name}, your Family Hub link: ${l.url}`;
  if (navigator.share) {
    navigator.share({ title: 'Family Hub', text: text }).catch(() => {});
  } else {
    $('#link-' + i).select();
    try { navigator.clipboard.writeText(l.url).then(() => toast('Link copied')); } catch (e) { toast('Select the link and copy it'); }
  }
}
function showLinks() {
  EDITING = true;
  call('adminGetLinks').then(links => {
    LINKS = links;
    $('#view').innerHTML = `<h2>Personal links</h2><div class="card muted">Each link logs that person in — share it only with them. On the phone: open it, then “Add to Home Screen”.</div>` +
      links.map((l, i) => `<div class="card"><b>${esc(l.name)}</b><input id="link-${i}" readonly value="${esc(l.url)}" onclick="this.select()" style="margin-top:6px">
        <div class="actions"><button class="btn sec small" onclick="shareLink(${i})">Share…</button></div></div>`).join('') +
      `<button class="btn sec" onclick="go('admin')">Back</button>`;
  });
}

// ---------- supermarket ----------
// What's typed in the add box survives the auto-refresh redraws.
const DRAFT = { name: '', qty: '', cat: 'auto', urgent: false, usualsOpen: false };
// Catalog keys can hold any text; buttons refer to them by index instead of quoting them.
let GREFS = [];
const gref = key => GREFS.push(key) - 1;
const gKey = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
const ACTIVE = ['needed', 'checked', 'wish'];
const onListItem = key => S.groceries.items.find(i => ACTIVE.includes(i.status) && gKey(i.name) === key);
const catalogItem = key => S.groceries.catalog.find(c => c.key === key);
const tmpAttr = i => String(i.id).startsWith('tmp') ? 'disabled' : '';

/** Items still to buy, grouped in the store's category order; urgent ones first in each group. */
function neededGroups() {
  const cats = S.groceries.categories;
  const rank = c => { const i = cats.indexOf(c); return i < 0 ? cats.length : i; };
  const items = S.groceries.items.filter(i => i.status === 'needed')
    .sort((a, b) => rank(a.category) - rank(b.category) || b.urgent - a.urgent || a.added_at - b.added_at);
  const groups = [];
  items.forEach(i => {
    const cat = cats.includes(i.category) ? i.category : '';
    const last = groups[groups.length - 1];
    if (last && last[0] === cat) last[1].push(i); else groups.push([cat, [i]]);
  });
  return groups;
}

function itemRow(i) {
  const done = i.status === 'checked';
  return `<div class="gi ${done ? 'done' : ''}">
    <button class="ck" ${tmpAttr(i)} title="${done ? 'Put back on the list' : 'In the cart'}" onclick="checkItem('${i.id}', ${!done})">${done ? '✓' : ''}</button>
    <div class="gn" ${tmpAttr(i) ? '' : `onclick="groceryForm('${i.id}')"`}><bdi>${esc(i.name)}</bdi>${i.qty ? ` · <bdi>${esc(i.qty)}</bdi>` : ''}${i.urgent ? ' <span class="tag-urgent">⚡ urgent</span>' : ''}
      <div class="muted">${esc(i.added_by)}${i.added_at ? ' · ' + rel(i.added_at) : ''}${done && i.checked_by ? ' · 🛒 ' + esc(i.checked_by) : ''}</div></div>
    <button class="btn sec small icon" title="Delete" ${tmpAttr(i)} onclick="deleteItem('${i.id}')">🗑</button>
  </div>`;
}

/** Bought at least 3 times, not on the list, and it's been longer than usual since the last time. */
function lowSuggestions() {
  const now = Date.now();
  return S.groceries.catalog.map(c => {
    if (c.count < 3 || !c.first || !c.last || (c.snoozed && c.snoozed > now) || onListItem(c.key)) return null;
    const every = (c.last - c.first) / (c.count - 1) / 86400000;
    const since = (now - c.last) / 86400000;
    return every >= 2 && every <= 60 && since >= every ? { c: c, every: every, since: since } : null;
  }).filter(Boolean).sort((a, b) => b.since / b.every - a.since / a.every).slice(0, 8);
}

/** The most-bought items that aren't on the list (or already suggested as running low). */
function usuals(low) {
  return S.groceries.catalog
    .filter(c => c.count >= 2 && !onListItem(c.key) && !low.some(l => l.c.key === c.key))
    .slice(0, 18);
}

// Category guess for items the family hasn't bought before (English + Hebrew; the longest match wins).
const GUESS = {
  '🥬 Fruit & vegetables': 'apple|banana|orange|lemon|tomato|cucumber|potato|onion|garlic|carrot|pepper|lettuce|avocado|grape|strawberr|melon|pear|peach|mango|zucchini|eggplant|cabbage|parsley|coriander|cilantro|dill|mint|mushroom|corn|fruit|vegetable|clementine|תפוח|בננ|תפוז|לימון|עגבני|מלפפון|תפוחי אדמה|בצל|שום|גזר|פלפל|חסה|אבוקדו|ענב|תות|מלון|אבטיח|אגס|אפרסק|מנגו|קישוא|חציל|כרוב|פטרוזיליה|כוסברה|שמיר|נענע|פטרי|תירס|בטטה|פירות|ירקות|קלמנטינ',
  '🍞 Bakery': 'bread|pita|roll|bagel|baguette|challah|bun|cake|croissant|לחם|פיתה|פיתות|לחמני|בייגל|באגט|חלה|חלות|עוגה|קרואסון',
  '🥛 Dairy & eggs': 'milk|egg|cheese|yogurt|yoghurt|butter|cream|cottage|labane|חלב|ביצ|גבינ|יוגורט|חמאה|שמנת|קוטג|לבנה|מעדן|שוקו|פודינג',
  '🥩 Meat & fish': 'chicken|beef|meat|fish|salmon|steak|turkey|schnitzel|mince|עוף|בשר|דג|סלמון|סטייק|הודו|שניצל|טחון|כרעיים|חזה|פרגית|קבב',
  '🧀 Deli & salads': 'salami|ham|pastrami|hummus|tahini|salad|נקניק|פסטרמה|חומוס|טחינה|סלט|מטבוחה',
  '🥫 Pantry': 'rice|pasta|spaghetti|flour|sugar|salt|olive oil|oil|vinegar|sauce|ketchup|mayo|mustard|spice|cereal|cornflakes|honey|jam|beans|lentils|tuna|coffee|tea|oats|אורז|פסטה|ספגטי|קמח|סוכר|מלח|שמן|חומץ|רוטב|קטשופ|מיונז|חרדל|תבלין|דגני|קורנפלקס|דבש|ריבה|שעועית|עדשים|טונה|שימורי|קפה|שיבולת',
  '🍫 Snacks & sweets': 'chocolate|candy|candies|chips|snack|cookie|biscuit|bamba|bisli|ice cream|gum|wafer|pretzel|שוקולד|ממתק|סוכריות|צ\'יפס|חטיף|עוגיות|ביסקוויט|במבה|ביסלי|גלידה|מסטיק|ופל|בייגלה|דובונים',
  '🥤 Drinks': 'water|juice|soda|cola|beer|wine|sprite|מים|מיץ|סודה|קולה|בירה|יין|משקה|פטל|שתייה',
  '🧊 Frozen': 'frozen|pizza|peas|קפוא|פיצה|אפונה|שניצלונים|בורקס',
  '🧴 Cleaning & home': 'detergent|soap|dish|bleach|toilet paper|paper towel|napkin|trash bag|foil|sponge|softener|אקונומיקה|סבון|נוזל כלים|נייר טואלט|מגבות נייר|מפיות|שקיות זבל|נייר כסף|אלומיניום|ספוג|מרכך כביסה|אבקת כביסה|ג\'ל כביסה',
  '🧼 Toiletries': 'shampoo|toothpaste|toothbrush|deodorant|conditioner|diaper|wipes|pads|razor|שמפו|משחת שיניים|מברשת שיניים|דאודורנט|מרכך שיער|טיטול|חיתול|מגבונים|תחבושות|סכין גילוח',
};
function guessCategory(name) {
  const n = gKey(name);
  let best = '', len = 0;
  Object.keys(GUESS).forEach(cat => GUESS[cat].split('|').forEach(w => {
    if (w.length > len && n.includes(w)) { best = cat; len = w.length; }
  }));
  return S.groceries.categories.includes(best) ? best : '';
}
/** Where an item goes: the category it had before, else a guess from its name. */
function autoCategory(name) {
  const c = catalogItem(gKey(name));
  return c && S.groceries.categories.includes(c.category) ? c.category : guessCategory(name);
}
const draftCategory = name => DRAFT.cat !== 'auto' ? DRAFT.cat : autoCategory(name);
const needsOk = cat => !S.me.isAdmin && S.groceries.wishCategories.includes(cat);

function hintHtml() {
  const name = DRAFT.name.trim();
  if (!name) return '';
  const on = onListItem(gKey(name));
  if (on) return `✓ Already ${on.status === 'checked' ? 'in the cart' : on.status === 'wish' ? 'asked for' : 'on the list'} (${esc(on.added_by)}, ${rel(on.added_at)})`;
  const cat = draftCategory(name);
  return (cat ? 'Goes to ' + esc(cat) : 'Goes to Not sorted') + (needsOk(cat) ? ' · 🙋 needs a parent\'s OK' : '');
}
function groceryHint() { const h = $('#g_hint'); if (h) h.innerHTML = hintHtml(); }

/**
 * Shopping-list changes show right away (mutate) and are sent in the background.
 * The screen takes the server's answer only when no other change is still on its way.
 */
function gAct(mutate, fn, ...args) {
  VER++; GPENDING++;
  if (mutate) { mutate(); render(); }
  return call(fn, ...args)
    .then(s => { GPENDING--; if (!GPENDING) { if (EDITING) S = s; else update(s); } })
    .catch(() => { GPENDING--; load(); });
}

function addItem(name, qty, category, urgent) {
  const on = onListItem(gKey(name));
  if (on) {
    toast(`${name} is already ${on.status === 'checked' ? 'in the cart' : 'on the list'} (${on.added_by})`);
    if (urgent && !on.urgent) gAct(() => { on.urgent = true; }, 'addGrocery', { name: name, urgent: true });
    else render();
    return;
  }
  const wish = needsOk(category);
  gAct(() => S.groceries.items.push({ id: 'tmp' + Date.now(), name: name, qty: qty, category: category, urgent: urgent,
                                      status: wish ? 'wish' : 'needed', added_by: S.me.name, added_at: Date.now() }),
       'addGrocery', { name: name, qty: qty, category: category, urgent: urgent });
  if (wish) toast('🙋 Added as a wish: a parent needs to OK it');
}
function addGrocery() {
  const name = DRAFT.name.trim();
  if (!name) { $('#g_name').focus(); return; }
  const qty = DRAFT.qty.trim(), category = draftCategory(name), urgent = DRAFT.urgent;
  Object.assign(DRAFT, { name: '', qty: '', cat: 'auto', urgent: false });
  addItem(name, qty, category, urgent);
}
function quickAdd(ref) {
  const c = catalogItem(GREFS[ref]);
  if (c) addItem(c.name, '', autoCategory(c.name), false);
}
function snooze(ref) {
  const c = catalogItem(GREFS[ref]);
  if (c) gAct(() => { c.snoozed = Date.now() + 3 * 86400000; }, 'snoozeGrocery', c.key);
}
const findItem = id => S.groceries.items.find(i => i.id === id);
function checkItem(id, checked) {
  const i = findItem(id);
  if (i) gAct(() => { i.status = checked ? 'checked' : 'needed'; i.checked_by = S.me.name; }, 'checkGrocery', id, checked);
}
function deleteItem(id) {
  const i = findItem(id);
  if (!i) return;
  const copy = Object.assign({}, i);
  gAct(() => { S.groceries.items = S.groceries.items.filter(x => x.id !== id); }, 'deleteGrocery', id);
  toast(`Deleted ${i.name}`, () => gAct(() => { if (!onListItem(gKey(copy.name))) S.groceries.items.push(copy); }, 'restoreGrocery', id));
}
function answerWish(id, ok) {
  const i = findItem(id);
  if (i) gAct(() => { i.status = ok ? 'needed' : 'declined'; }, 'adminAnswerWish', id, ok);
}
function finishShopping(btn) {
  const n = S.groceries.items.filter(i => i.status === 'checked').length;
  const left = S.groceries.items.filter(i => i.status === 'needed').length;
  if (confirm(`Mark ${n} item${n === 1 ? '' : 's'} as bought?` + (left ? ` ${left} stay on the list for next time.` : ''))) {
    VER++;
    act(btn, call('finishShopping'), 'Shopping done 🛒✓');
  }
}

function groceryForm(id) {
  const i = findItem(id);
  if (!i) return;
  const cats = S.groceries.categories;
  form('Edit item', `
    <label>What</label><input id="ge_name" dir="auto" value="${esc(i.name)}">
    <label>How much (optional)</label><input id="ge_qty" dir="auto" value="${esc(i.qty)}" placeholder="2 kg · the big pack">
    <label>Category</label><select id="ge_cat"><option value="">Not sorted</option>
      ${cats.map(c => `<option ${c === i.category ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
    <label class="check"><input id="ge_urgent" type="checkbox" ${i.urgent ? 'checked' : ''}> ⚡ Urgent</label>
    <div class="muted">Added by ${esc(i.added_by)} · ${rel(i.added_at)}${i.updated_by && i.updated_by !== i.added_by ? ' · last change by ' + esc(i.updated_by) : ''}</div>`,
    () => { VER++; return call('editGrocery', id, { name: val('ge_name'), qty: val('ge_qty'), category: val('ge_cat'), urgent: chk('ge_urgent') }); });
}

function grocerySettingsForm() {
  form('🛒 Shopping categories', `
    <div class="muted">One per line, in the order you walk through the store. The shopping list is sorted this way.
      Renaming a category moves its items to "Not sorted".</div>
    <textarea id="gs_cats" rows="13" oninput="wishBoxes()">${esc(S.groceries.categories.join('\n'))}</textarea>
    <label>🙋 Wishes: members' items in these categories wait for an admin's OK</label><div id="gs_wish"></div>`,
    () => call('adminSaveGrocerySettings', {
      categories: val('gs_cats').split('\n'),
      wishCategories: [...document.querySelectorAll('.gs_w:checked')].map(x => x.value),
    }));
  wishBoxes();
}
function wishBoxes() {
  const box = $('#gs_wish');
  const checked = box.children.length ? [...document.querySelectorAll('.gs_w:checked')].map(x => x.value) : S.groceries.wishCategories;
  box.innerHTML = val('gs_cats').split('\n').map(s => s.trim()).filter(Boolean)
    .map(c => `<label class="check"><input type="checkbox" class="gs_w" value="${esc(c)}" ${checked.includes(c) ? 'checked' : ''}> ${esc(c)}</label>`).join('');
}

// ---------- boot ----------
// The personal link is …/#u=<token>. Remember it so the home-screen icon keeps
// working even if the phone drops the #fragment.
(function boot() {
  const fromLink = new URLSearchParams(location.hash.slice(1)).get('u');
  let saved = '';
  try { saved = localStorage.getItem('familyHubToken') || ''; } catch (e) {}
  TOKEN = fromLink || saved;
  if (fromLink) { try { localStorage.setItem('familyHubToken', fromLink); } catch (e) {} }
  if (!window.FAMILY_HUB_API) { $('#view').innerHTML = '<div class="card">The app is not configured yet (config.js).</div>'; return; }
  if (!TOKEN) { $('#view').innerHTML = '<div class="card">This page needs your personal link. Ask Mom or Dad for it.</div>'; return; }
  load();
  // Every minute; every 20 s on the shopping list, so two people in the store see each other's ticks.
  setInterval(() => { if (!document.hidden && (TAB === 'shop' || Date.now() - LAST_LOAD > 55000)) load(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>
