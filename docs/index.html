<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Hub</title>
<meta name="theme-color" content="#2563eb">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Hub">
<script src="config.js"></script>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e3e6ea;
          --accent:#2563eb; --ok:#15803d; --warn:#b45309; --bad:#dc2626;
          --yellow:#facc15; --red:#dc2626; --gold:#d97706; --wa:#16a34a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1b2027; --ink:#e8eaed; --muted:#9aa3ad; --line:#2b323b;
            --accent:#60a5fa; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --gold:#fbbf24; --wa:#4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); padding-bottom:76px; }
  header { position:sticky; top:0; z-index:2; background:var(--card); border-bottom:1px solid var(--line);
           padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
  main { padding:12px 16px; max-width:640px; margin:0 auto; }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:18px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .card.yellow { border-left:5px solid var(--yellow); }
  .card.red { border-left:5px solid var(--red); }
  .card.good { border-left:5px solid var(--gold); }
  .card.offer { border:2px solid var(--accent); }
  .card.dim { opacity:.6; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .muted { color:var(--muted); font-size:14px; }
  .title { font-weight:600; }
  .chip { display:inline-block; padding:2px 9px; margin:2px 4px 2px 0; border-radius:999px; font-size:13px; border:1px solid var(--line); }
  .chip.extra { border-color:var(--accent); color:var(--accent); }
  .chip.now { background:var(--accent); border-color:var(--accent); color:#fff; }
  .overdue { color:var(--bad); } .soon { color:var(--warn); } .ok { color:var(--ok); }
  .btn { border:0; border-radius:10px; padding:9px 14px; font-size:15px; background:var(--accent); color:#fff;
         cursor:pointer; text-decoration:none; white-space:nowrap; display:inline-block; }
  .btn.go { background:var(--ok); }
  .btn.sec { background:transparent; color:var(--accent); border:1px solid var(--line); }
  .btn.small { padding:5px 10px; font-size:13px; }
  .btn.wa { color:var(--wa); border-color:var(--wa); background:transparent; }
  .btn.icon { padding:4px 9px; }
  .btn:disabled { opacity:.5; }
  input, select, textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
                            background:var(--bg); color:var(--ink); font:inherit; }
  input[type=checkbox] { width:auto; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  .check { display:flex; gap:8px; align-items:center; color:var(--ink); font-size:15px; margin:6px 0; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .notice { border-radius:8px; padding:8px 10px; margin-top:10px; background:var(--bg); border:1px solid var(--line); }
  .line { list-style:none; margin:6px 0 0; padding:0; }
  .line li { display:flex; align-items:center; gap:6px; padding:5px 0; border-bottom:1px dashed var(--line); }
  .line li .n { width:22px; color:var(--muted); font-size:13px; }
  .line li .who { flex:1; }
  table.sum { width:100%; border-collapse:collapse; }
  table.sum td { padding:6px 4px; border-bottom:1px solid var(--line); }
  table.sum td.n { text-align:center; width:64px; }
  .dots { letter-spacing:2px; }
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--line); }
  nav button { flex:1; border:0; background:none; padding:8px 0 12px; font-size:12px; color:var(--muted); cursor:pointer; }
  nav button.on { color:var(--accent); font-weight:600; }
  nav .ic { display:block; font-size:20px; }
  .badge { background:var(--bad); color:#fff; border-radius:999px; font-size:11px; padding:0 6px; margin-left:2px; }
  #toast { position:fixed; left:16px; right:16px; bottom:84px; background:#222; color:#fff; padding:10px 14px;
           border-radius:10px; display:none; z-index:5; }
</style>
</head>
<body>
<header><strong>🏠 Family Hub</strong><span id="who" class="muted"></span></header>
<main id="view"><p class="muted">Loading…</p></main>
<nav id="nav"></nav>
<div id="toast"></div>

<script>
let TOKEN = '', S = null, TAB = 'tasks', EDITING = false;
const $ = sel => document.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
// A slot is one name ("Noa") or a group ("Dad+Noa").
const who = slot => String(slot || '').split('+').map(s => s.trim()).filter(Boolean).join(' & ');

// text/plain keeps this a "simple" request, so Apps Script needs no CORS preflight.
function call(fn, ...args) {
  return fetch(window.FAMILY_HUB_API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: [TOKEN, ...args] }),
  })
    .then(r => r.json())
    .then(res => { if (!res.ok) throw new Error(res.error); return res.data; })
    .catch(e => { toast(e.message === 'Failed to fetch' ? 'No connection to the server' : e.message); throw e; });
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = 'none', 3500);
}
function update(state) {
  EDITING = false;
  // An older backend answers in an older format; say so instead of hanging on "Loading…".
  if (!state || !state.rotating || !state.dates) {
    $('#view').innerHTML = '<div class="card">⚠️ The app was updated but its Google backend is still the old version.<br>' +
      'An admin needs to open Apps Script → <b>Deploy → Manage deployments → ✏️ Edit → New version → Deploy</b>.</div>';
    return;
  }
  S = state;
  try { render(); } catch (e) {
    $('#view').innerHTML = `<div class="card">⚠️ Something went wrong showing the app: ${esc(e.message)}</div>`;
  }
}
function load() { if (!EDITING) call('getState').then(update).catch(() => {
  if (!S) $('#view').innerHTML = '<div class="card">Could not load. Make sure you opened your personal link.</div>';
}); }

// ---------- formatting ----------
function when(ms) {
  if (!ms) return '';
  const d = new Date(ms);
  return d.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'numeric' }) + ' ' +
         d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
}
const day = ms => new Date(ms).toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });
function rel(ms) {
  const diff = ms - Date.now(), abs = Math.abs(diff), h = abs / 3600000;
  const txt = h < 1 ? Math.round(abs / 60000) + ' min' : h < 48 ? Math.round(h) + ' h' : Math.round(h / 24) + ' days';
  return diff < 0 ? txt + ' ago' : 'in ' + txt;
}
function dueClass(ms) { const d = ms - Date.now(); return d < 0 ? 'overdue' : d < 3 * 3600000 ? 'soon' : ''; }
function toInput(ms) { const d = new Date(ms); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); }
function tonight9pm() {
  const d = new Date(); d.setHours(21, 0, 0, 0);
  if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);  // already past 21:00 → tomorrow
  return d.getTime();
}
/** The next two 1st-of-month dates (today counts if it is the 1st). */
function nextPaydays() {
  const now = new Date();
  const first = now.getDate() === 1 ? new Date(now.getFullYear(), now.getMonth(), 1)
                                    : new Date(now.getFullYear(), now.getMonth() + 1, 1);
  return [first, new Date(first.getFullYear(), first.getMonth() + 1, 1)];
}
const shekel = n => '₪' + Number(n).toLocaleString();
const STATUS = { done:'✅ Done', missed:'❌ Missed', excused:'⏭️ Skipped', cancelled:'🚫 Cancelled' };
const isMine = t => t.members.indexOf(S.me.name) >= 0;
const memberOptions = (exclude, selected) => S.users.filter(u => u.name !== exclude)
  .map(u => `<option ${u.name === selected ? 'selected' : ''}>${esc(u.name)}</option>`).join('');
const activeRotating = () => S.rotating.filter(a => a.active);
const openTasks = () => activeRotating().filter(a => a.current).map(a => a.current).concat(S.oneTime);

// ---------- WhatsApp click-to-chat ----------
/**
 * Opens WhatsApp on the phone with a chat to that member and the text already
 * written; the sender taps Send. Without a saved phone number WhatsApp asks
 * which contact to send it to.
 */
function waUrl(name, text) {
  const u = S.users.find(x => x.name === name);
  let digits = String((u && u.phone) || '').replace(/\D/g, '');
  if (digits.charAt(0) === '0') digits = '972' + digits.slice(1);
  return 'https://wa.me/' + digits + (text ? '?text=' + encodeURIComponent(text) : '');
}
const waBtn = (name, text, label) =>
  `<a class="btn small wa" href="${esc(waUrl(name, text))}" target="_blank" rel="noopener">💬 ${esc(label)}</a>`;
/** One button per member of a slot ("Dad & Noa" gets two). */
const waBtns = (slot, textFor, label) => String(slot).split('+').filter(Boolean)
  .map(n => waBtn(n, textFor(n), String(slot).includes('+') ? label + ' ' + n : label)).join('');

const MSG = {
  rotating: (n, t) => `Hi ${n}, it's your turn for "${t.title}" 🧹 When you finish, press Done in Family Hub.`,
  oneTime: (n, t) => `Hi ${n}, a reminder: "${t.title}" is due ${when(t.due_at)} 🧹 When you finish, press Done in Family Hub.`,
  date: (n, t) => `Hi ${n}, a reminder: "${t.title}" — ${when(t.due_at)}${t.place ? ' at ' + t.place : ''} 🎉`,
  warning: n => {
    const s = S.cards.summary.find(c => c.name === n);
    return s && s.yellow
      ? `⚠️ ${n}, this is a warning. You already have a yellow card — the next one becomes a red card 🟥`
      : `⚠️ ${n}, this is a warning. Next time you'll get a yellow card 🟨`;
  },
  card: c => c.color === 'red'
    ? `🟥 ${c.member}, this is a red card (two yellow cards): ${c.explanation}. Penalty: an extra turn in "${c.red_task}".`
    : `🟨 ${c.member}, you got a yellow card: ${c.explanation}. A second yellow card becomes a red card.`,
  goodWord: g => `🌟 ${g.member}, a good word for you: ${g.explanation}` +
    (g.prize ? `\n🎁 That's ${S.goodWords.perPrize} good words — your prize: ${g.prize}` : ''),
  nudge: t => `Hi ${t.offer_to}, I asked you in Family Hub to ${t.offer_kind === 'switch' ? 'switch turns with me for' : 'take'} "${t.title}". Can you accept it in the app? 🙏`,
};
const remindBtns = t => waBtns(t.assignee, n => t.rotating ? MSG.rotating(n, t) : MSG.oneTime(n, t), 'Remind');

// ---------- shell ----------
function render() {
  $('#who').textContent = S.me.name + (S.me.isAdmin ? ' · admin' : '');
  const mine = openTasks().filter(isMine).length + S.offers.length;
  const tabs = [['tasks','🧹','Tasks', mine], ['cards','🟨','Cards'], ['fun','🎉','Fun Stuff']];
  if (S.me.isAdmin) tabs.push(['admin','⚙️','Admin', S.replaceRequests.length]);
  $('#nav').innerHTML = tabs.map(([id, ic, label, n]) =>
    `<button class="${TAB === id ? 'on' : ''}" onclick="go('${id}')"><span class="ic">${ic}</span>${label}${n ? `<span class="badge">${n}</span>` : ''}</button>`).join('');
  $('#view').innerHTML = VIEWS[TAB]();
}
function go(tab) { TAB = tab; EDITING = false; render(); window.scrollTo(0, 0); }

function taskCard(t) {
  const mine = isMine(t);
  let state = '';
  let buttons = '';
  if (t.offer_to) {
    state = `🔄 Waiting for ${esc(t.offer_to)} to ${t.offer_kind === 'switch' ? 'switch' : 'take it'}`;
    if (t.offer_by === S.me.name) {
      buttons += `<button class="btn sec small" onclick="answerOffer('${t.id}', false, this)">Withdraw</button>` + waBtn(t.offer_to, MSG.nudge(t), 'Nudge');
    }
  } else if (t.replace_request === 'pending') {
    state = '🙋 Asked the admins for a replacement';
    if (mine) buttons += `<button class="btn sec small" onclick="withdrawReplace('${t.id}', this)">Withdraw</button>`;
  } else if (mine) {
    buttons += `<button class="btn sec small" onclick="offerForm('${t.id}', 'pass')">Pass to…</button>`
      + (t.rotating ? `<button class="btn sec small" onclick="offerForm('${t.id}', 'switch')">Switch with…</button>` : '')
      + `<button class="btn sec small" onclick="replaceForm('${t.id}')">Ask to be replaced</button>`;
  }
  if (t.replace_request === 'declined' && mine) state = state || 'The admins declined your replacement request';
  const done = mine || S.me.isAdmin ? doneRow(t) : '';
  return `<div class="card">
    <div class="row"><span class="title">${t.rotating ? '🔁' : '📌'} ${esc(t.title)}</span><span class="muted">${esc(who(t.assignee))}</span></div>
    ${t.rotating ? '' : `<div class="${dueClass(t.due_at)}">Due ${when(t.due_at)} · ${rel(t.due_at)}</div>`}
    ${state ? `<div class="muted">${state}</div>` : ''}
    ${done}
    ${buttons ? `<div class="actions">${buttons}</div>` : ''}
  </div>`;
}

/** Note box + Done button. Admins also get it on other members' turns (marks it done for them). */
function doneRow(t) {
  const forOther = !isMine(t);
  return `<div class="actions"><input id="note-${t.id}" placeholder="Note (optional)" style="flex:1;min-width:120px">
      <button class="btn go" onclick="complete('${t.id}', this)">✓ Done${forOther ? ' for ' + esc(who(t.assignee)) : ''}</button></div>`;
}

function lineChips(a) {
  return (a.current ? `<span class="chip now">${esc(who(a.current.assignee))}</span>` : '') +
    a.upcoming.map(u => `<span class="chip ${u.extra ? 'extra' : ''}" title="${u.extra ? 'Extra turn' : ''}">${esc(who(u.name))}${u.extra ? ' ➕' : ''}</span>`).join('');
}

function dateCard(t, past) {
  return `<div class="card ${past ? 'dim' : ''}">
    <div class="row"><span class="title">🎉 ${esc(t.title)}</span><span class="muted">${esc(who(t.assignee))}</span></div>
    <div>${when(t.due_at)}${past ? '' : ' · ' + rel(t.due_at)}</div>
    ${t.place ? `<div class="muted">📍 ${esc(t.place)}</div>` : ''}
    ${S.me.isAdmin && !past ? `<div class="actions">${waBtns(t.assignee, n => MSG.date(n, t), 'Remind')}
      <button class="btn sec small" onclick="dateForm('${t.id}')">Edit</button>
      <button class="btn sec small" onclick="deleteDate('${t.id}', this)">Delete</button></div>` : ''}
  </div>`;
}

function cardItem(c) {
  const icon = c.color === 'red' ? '🟥' : '🟨';
  return `<div class="card ${c.color} ${c.color === 'yellow' && c.used ? 'dim' : ''}">
    <div class="row"><span class="title">${icon} ${esc(c.member)}</span><span class="muted">${day(c.created_at)}</span></div>
    <div>${esc(c.explanation)}</div>
    <div class="muted">${c.task ? 'About: ' + esc(c.task) + ' · ' : ''}${c.color === 'red' ? 'Extra turn in: <b>' + esc(c.red_task) + '</b> · ' : ''}${c.color === 'yellow' && c.used ? 'became part of a red card · ' : ''}by ${esc(c.by)}</div>
    ${S.me.isAdmin ? `<div class="actions">${waBtn(c.member, MSG.card(c), 'Send')}</div>` : ''}
  </div>`;
}

function goodItem(g) {
  return `<div class="card good">
    <div class="row"><span class="title">🌟 ${esc(g.member)}</span><span class="muted">${day(g.created_at)}</span></div>
    <div>${esc(g.explanation)}</div>
    ${g.prize ? `<div style="margin-top:4px">🎁 <b>Prize:</b> ${esc(g.prize)}</div>` : ''}
    <div class="muted">by ${esc(g.by)}</div>
    ${S.me.isAdmin ? `<div class="actions">${waBtn(g.member, MSG.goodWord(g), 'Send')}</div>` : ''}
  </div>`;
}

// ---------- views ----------
const VIEWS = {
  tasks() {
    const all = openTasks();
    const mine = all.filter(isMine);
    const otherOneTime = S.oneTime.filter(t => !isMine(t)).sort((a, b) => a.due_at - b.due_at);
    const offers = S.offers.map(t => `<div class="card offer">
      <div class="title">🔄 ${esc(t.offer_by)} asks you to take “${esc(t.title)}”</div>
      ${t.rotating ? '' : `<div class="${dueClass(t.due_at)}">Due ${when(t.due_at)}</div>`}
      <div class="muted">${t.offer_kind === 'switch' ? `Switch: you do this turn now, and ${esc(t.offer_by)} does your next “${esc(t.title)}” turn.` : 'Pass: you take it, nothing in return.'}</div>
      <div class="actions"><button class="btn go" onclick="answerOffer('${t.id}', true, this)">Accept</button>
        <button class="btn sec" onclick="answerOffer('${t.id}', false, this)">Decline</button></div></div>`).join('');
    const rotations = activeRotating().map(a => `<div class="card">
      <div class="title">🔁 ${esc(a.name)}</div><div style="margin-top:4px">${lineChips(a)}</div>
      ${S.me.isAdmin && a.current && !isMine(a.current) ? doneRow(a.current) : ''}</div>`).join('');
    const history = S.history.map(t => `<div class="card">
      <div class="row"><span class="title">${esc(t.title)}</span>
        <span class="${t.status === 'done' ? 'ok' : 'muted'}">${STATUS[t.status] || esc(t.status)}</span></div>
      <div class="muted">${esc(who(t.assignee))} · ${t.completed_at ? when(t.completed_at) : ''}${t.completed_by && !t.members.includes(t.completed_by) ? ' · by ' + esc(t.completed_by) : ''}</div>
      ${t.note ? `<div class="muted">“${esc(t.note)}”</div>` : ''}</div>`).join('');
    return (offers ? '<h2>Requests for you</h2>' + offers : '') +
      '<h2>My tasks</h2>' + (mine.length ? mine.map(taskCard).join('') : '<div class="card muted">Nothing for you right now 🎉</div>') +
      (rotations ? '<h2>Rotations</h2>' + rotations : '') +
      (otherOneTime.length ? '<h2>Other one-time tasks</h2>' + otherOneTime.map(taskCard).join('') : '') +
      (history ? '<h2>History</h2>' + history : '');
  },
  cards() {
    return '<h2>Cards</h2><div class="card"><table class="sum"><tr><td></td><td class="n muted">🟨 now</td><td class="n muted">🟥 total</td>' +
        (S.me.isAdmin ? '<td></td>' : '') + '</tr>' +
        S.cards.summary.map(c => `<tr><td>${esc(c.name)}</td><td class="n">${c.yellow ? '🟨' : '–'}</td><td class="n">${c.red}</td>` +
          (S.me.isAdmin ? `<td style="text-align:right">${waBtn(c.name, MSG.warning(c.name), 'Warn')}</td>` : '') + '</tr>').join('') +
        '</table><div class="muted" style="margin-top:8px">A second yellow card becomes a red card, which means an extra turn in a task.</div></div>' +
      '<h2>All cards</h2>' + (S.cards.list.map(cardItem).join('') || '<div class="card muted">No cards yet 👏</div>');
  },
  fun() {
    const per = S.goodWords.perPrize;
    const paydays = nextPaydays();
    return '<h2>Coming dates</h2>' + (S.dates.upcoming.map(t => dateCard(t, false)).join('') || '<div class="card muted">Nothing planned yet.</div>') +
      '<h2>Good words</h2><div class="card"><table class="sum">' +
        S.goodWords.summary.map(g => { const p = g.count % per; return `<tr><td>${esc(g.name)}</td>
          <td class="n">🌟 ${g.count}</td><td class="dots">${'★'.repeat(p)}${'☆'.repeat(per - p)}</td></tr>`; }).join('') +
        `</table><div class="muted" style="margin-top:8px">Every ${per} good words earn a prize 🎁</div></div>` +
        S.goodWords.list.map(goodItem).join('') +
      '<h2>Allowance</h2>' + (S.allowance.filter(a => a.amount > 0 || !S.me.isAdmin).map(a => `<div class="card">
        <div class="row"><span class="title">💰 ${esc(a.name)}</span><span class="title">${shekel(a.amount)} / month</span></div>
        ${paydays.map(d => `<div class="row muted"><span>${day(d.getTime())}</span><span>${shekel(a.amount)}</span></div>`).join('')}
      </div>`).join('') || '<div class="card muted">No allowance set.</div>') +
      (S.dates.past.length ? '<h2>Past dates</h2>' + S.dates.past.map(t => dateCard(t, true)).join('') : '');
  },
  admin() {
    const replace = S.replaceRequests.map(t => `<div class="card offer">
      <div class="row"><span class="title">🙋 ${esc(who(t.assignee))} asks to be replaced</span></div>
      <div>${t.rotating ? '🔁' : '📌'} ${esc(t.title)}${t.rotating ? '' : ' · due ' + when(t.due_at)}</div>
      ${t.replace_reason ? `<div class="muted">“${esc(t.replace_reason)}”</div>` : ''}
      <label>Replace with</label><select id="rep-${t.id}">${memberOptions(t.members[0])}</select>
      <div class="actions"><button class="btn" onclick="answerReplace('${t.id}', val('rep-${t.id}'), this)">Replace</button>
        <button class="btn sec" onclick="answerReplace('${t.id}', '', this)">Decline</button></div></div>`).join('');
    const rotating = S.rotating.map(a => {
      const c = a.current;
      return `<div class="card">
        <div class="row"><span class="title">🔁 ${esc(a.name)}${a.active ? '' : ' <span class="muted">(inactive)</span>'}</span>
          <button class="btn sec small" onclick="rotatingForm('${a.id}')">Edit</button></div>
        <div class="muted">Rotation: ${esc(a.rotation.split(', ').map(who).join(' → '))}</div>
        ${c ? `<div style="margin-top:8px">Now: <b>${esc(who(c.assignee))}</b></div>
          <div class="actions">${remindBtns(c)}
            <button class="btn sec small" onclick="reassignForm('${c.id}')">Reassign</button>
            <button class="btn sec small" onclick="skipTurn('${c.id}', this)">Skip turn</button></div>` : ''}
        ${a.active ? `<div class="muted" style="margin-top:10px">Coming up${a.changed ? ' (changed — returns to the normal order afterwards)' : ''}:</div>
          <ul class="line">${a.upcoming.map((u, i) => `<li><span class="n">${i + 1}.</span>
            <span class="who">${esc(who(u.name))}${u.extra ? ' <span class="chip extra">➕ extra</span>' : ''}</span>
            <button class="btn sec small icon" title="Earlier" ${i === 0 ? 'disabled' : ''} onclick="moveTurn('${a.id}', ${i}, -1, this)">↑</button>
            <button class="btn sec small icon" title="Later" onclick="moveTurn('${a.id}', ${i}, 1, this)">↓</button>
            ${u.extra ? `<button class="btn sec small icon" title="Remove extra turn" onclick="removeTurn('${a.id}', ${i}, this)">✕</button>` : ''}
          </li>`).join('')}</ul>
          <div class="actions"><button class="btn small" onclick="insertForm('${a.id}')">➕ Add a turn</button>
            ${a.changed ? `<button class="btn sec small" onclick="resetOrder('${a.id}', this)">Back to normal order</button>` : ''}</div>` : ''}
      </div>`;
    }).join('');
    const oneTime = S.oneTime.slice().sort((a, b) => a.due_at - b.due_at).map(t => `<div class="card">
      <div class="row"><span class="title">📌 ${esc(t.title)}</span><span class="muted">${esc(who(t.assignee))}</span></div>
      <div class="${dueClass(t.due_at)}">Due ${when(t.due_at)} · ${rel(t.due_at)}</div>
      <div class="actions">${remindBtns(t)}
        <button class="btn sec small" onclick="oneTimeForm('${t.id}')">Edit</button>
        <button class="btn sec small" onclick="skipTurn('${t.id}', this)">Cancel task</button></div></div>`).join('');
    return (replace ? '<h2>Replacement requests</h2>' + replace : '') +
      `<div class="actions" style="margin-top:${replace ? 18 : 0}px">
        <button class="btn" onclick="rotatingForm()">+ Rotating task</button>
        <button class="btn" onclick="oneTimeForm()">+ One-time task</button>
        <button class="btn" onclick="dateForm()">+ Date</button></div>
      <div class="actions">
        <button class="btn sec" onclick="giveCard()">🟨 Yellow card</button>
        <button class="btn sec" onclick="giveGoodWord()">🌟 Good word</button>
        <button class="btn sec" onclick="editUser()">+ Add member</button>
        <button class="btn sec" onclick="showLinks()">Personal links</button></div>` +
      '<h2>Rotating tasks</h2>' + (rotating || '<div class="card muted">None yet.</div>') +
      '<h2>One-time tasks</h2>' + (oneTime || '<div class="card muted">None open.</div>') +
      '<h2>Family</h2>' + S.users.map((u, i) => `<div class="card row"><div><span class="title">${esc(u.name)}</span>
          <span class="muted">${esc(u.role)} · ${shekel(u.allowance)}/month</span>
          <div class="muted">${u.phone ? esc(u.phone) : 'no phone number'}</div></div>
        <span class="actions" style="margin-top:0;flex-shrink:0">${u.phone ? waBtn(u.name, '', 'Chat') : ''}
        <button class="btn sec small" onclick="editUser(S.users[${i}].name)">Edit</button></span></div>`).join('');
  },
};

// ---------- actions ----------
function busy(btn) { if (btn) btn.disabled = true; }
function act(btn, promise, msg) { busy(btn); promise.then(s => { if (msg) toast(msg); update(s); }).catch(() => { if (btn) btn.disabled = false; }); }
function complete(id, btn) { act(btn, call('completeTurn', id, $('#note-' + id).value), 'Nice! ✓'); }
function answerOffer(id, accept, btn) { act(btn, call('answerOffer', id, accept), accept ? 'It\'s yours now' : 'Done'); }
function withdrawReplace(id, btn) { act(btn, call('requestReplace', id, '', true)); }
function answerReplace(id, member, btn) { act(btn, call('adminAnswerReplace', id, member), member ? 'Replaced' : 'Declined'); }
function skipTurn(id, btn) { if (confirm('Are you sure?')) act(btn, call('adminSkipTurn', id)); }
function moveTurn(aid, i, dir, btn) { act(btn, call('adminMoveTurn', aid, i, dir)); }
function removeTurn(aid, i, btn) { act(btn, call('adminRemoveTurn', aid, i)); }
function resetOrder(aid, btn) { if (confirm('Remove all extra turns and changes, and go back to the normal order?')) act(btn, call('adminResetOrder', aid)); }
function deleteDate(id, btn) { if (confirm('Delete this date?')) act(btn, call('adminDeleteDate', id)); }

function form(title, body, onSave) {
  EDITING = true;
  $('#view').innerHTML = `<h2>${title}</h2><div class="card">${body}
    <div class="actions"><button class="btn" id="saveBtn">Save</button><button class="btn sec" onclick="go(TAB)">Cancel</button></div></div>`;
  $('#saveBtn').onclick = () => { busy($('#saveBtn')); onSave().then(update).catch(() => $('#saveBtn').disabled = false); };
  window.scrollTo(0, 0);
}
const val = id => $('#' + id).value;
const chk = id => $('#' + id).checked;
const msOf = id => new Date(val(id)).getTime();
const findTask = id => openTasks().find(x => x.id === id);

// ---------- member forms ----------
function offerForm(id, kind) {
  const t = findTask(id);
  form((kind === 'switch' ? 'Switch: ' : 'Pass: ') + esc(t.title), `
    <div class="muted">${kind === 'switch'
      ? 'They do this turn now, and you do their next “' + esc(t.title) + '” turn.'
      : 'They take this turn. Nothing in return.'} They have to accept it in the app.</div>
    <label>Ask</label><select id="o_to">${memberOptions(S.me.name)}</select>`,
    () => call('offerTurn', id, val('o_to'), kind));
}

function replaceForm(id) {
  const t = findTask(id);
  form('Ask to be replaced: ' + esc(t.title), `
    <div class="muted">The admins will see your request and can pick someone else for this turn.</div>
    <label>Why? (optional)</label><textarea id="r_reason" rows="3" maxlength="200"></textarea>`,
    () => call('requestReplace', id, val('r_reason'), false));
}

// ---------- admin forms ----------
function rotatingForm(id) {
  const a = S.rotating.find(x => x.id === id) || { name:'', rotation:'', active:true };
  form(id ? 'Edit rotating task' : 'New rotating task', `
    <label>Name</label><input id="a_name" value="${esc(a.name)}" placeholder="Dishes · Laundry">
    <label>Rotation order (comma separated)</label><input id="a_rot" value="${esc(a.rotation)}" placeholder="Noa, Yuval, Yael">
    <div class="muted">Members: ${esc(S.users.map(u => u.name).join(', '))}${id ? '. Changing the order starts the line fresh.' : ''}</div>
    <label class="check"><input id="a_active" type="checkbox" ${a.active ? 'checked' : ''}> Active</label>`,
    () => call('adminSaveActivity', { id: id || '', name: val('a_name'), rotation: val('a_rot'), active: chk('a_active') }));
}

function insertForm(aid) {
  const a = S.rotating.find(x => x.id === aid);
  const positions = [`<option value="0">Next — right after ${esc(who(a.current ? a.current.assignee : ''))}</option>`]
    .concat(a.upcoming.map((u, i) => `<option value="${i + 1}">After #${i + 1} (${esc(who(u.name))})</option>`)).join('');
  form('Add a turn: ' + esc(a.name), `
    <div class="muted">An extra turn. Everyone else keeps their place in the rotation.</div>
    <label>For</label><select id="i_who">${memberOptions('')}</select>
    <label>When</label><select id="i_pos">${positions}</select>`,
    () => call('adminInsertTurn', aid, Number(val('i_pos')), val('i_who')));
}

function reassignForm(id) {
  const t = findTask(id);
  form('Reassign: ' + esc(t.title), `
    <div class="muted">Someone else does this turn. The rotation order stays the same.</div>
    <label>Give this turn to</label><select id="t_who">${memberOptions('', t.members[0])}</select>`,
    () => call('adminEditTurn', id, { assignee: val('t_who') }));
}

function oneTimeForm(id) {
  const t = id ? findTask(id) : { title:'', members:[''], due_at: tonight9pm() };
  form(id ? 'Edit one-time task' : 'New one-time task', `
    <label>Task</label><input id="ot_title" value="${esc(t.title)}" placeholder="Clean the car">
    <label>For</label><select id="ot_who">${memberOptions('', t.members[0])}</select>
    <label>Due date &amp; time</label><input id="ot_due" type="datetime-local" value="${toInput(t.due_at)}">`,
    () => id ? call('adminEditTurn', id, { title: val('ot_title'), assignee: val('ot_who'), due_at: msOf('ot_due') })
             : call('adminCreateOneTimeTask', { title: val('ot_title'), assignee: val('ot_who'), due_at: msOf('ot_due') }));
}

function dateForm(id) {
  const t = S.dates.upcoming.find(x => x.id === id) || { title:'', members:[], due_at: tonight9pm(), place:'' };
  form(id ? 'Edit date' : 'New date', `
    <label>Name</label><input id="d_title" value="${esc(t.title)}" placeholder="Pizza night · Ice cream with Dad">
    <label>Who</label>${S.users.map((u, i) => `<label class="check"><input type="checkbox" class="d_who" value="${esc(u.name)}" ${t.members.includes(u.name) ? 'checked' : ''}> ${esc(u.name)}</label>`).join('')}
    <label>Time</label><input id="d_time" type="datetime-local" value="${toInput(t.due_at)}">
    <label>Place</label><input id="d_place" value="${esc(t.place)}" placeholder="The mall">`,
    () => call('adminSaveDate', { id: id || '', title: val('d_title'), due_at: msOf('d_time'), place: val('d_place'),
                                  members: [...document.querySelectorAll('.d_who:checked')].map(x => x.value) }));
}

function giveCard() {
  const taskOptions = activeRotating().map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('');
  form('🟨 Yellow card', `
    <label>For</label><select id="c_who" onchange="cardRedNotice()">${memberOptions('')}</select>
    <label>Why (everyone will see this)</label><textarea id="c_why" rows="3" maxlength="300"></textarea>
    <label>Related task (optional)</label><select id="c_task"><option value="">—</option>${taskOptions}</select>
    <div id="c_red"></div>`,
    () => call('adminGiveCard', { member: val('c_who'), explanation: val('c_why'), task_id: val('c_task'),
                                  red_task_id: $('#c_redtask') ? val('c_redtask') : '' }));
  cardRedNotice();
}
function cardRedNotice() {
  const s = S.cards.summary.find(c => c.name === val('c_who'));
  const tasks = activeRotating();
  $('#c_red').innerHTML = s && s.yellow ? `<div class="notice">🟥 <b>${esc(s.name)} already has a yellow card</b> — this one makes a <b>red card</b>.
      <label>Extra turn in</label>${tasks.length ? `<select id="c_redtask">${tasks.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select>`
      : '<div class="overdue">Create a rotating task first.</div>'}</div>` : '';
}

function giveGoodWord() {
  form('🌟 Good word', `
    <label>For</label><select id="g_who" onchange="goodPrizeNotice()">${memberOptions('')}</select>
    <label>What for (everyone will see this)</label><textarea id="g_why" rows="3" maxlength="300"></textarea>
    <div id="g_prize"></div>`,
    () => call('adminGiveGoodWord', { member: val('g_who'), explanation: val('g_why'), prize: $('#g_prizeval') ? val('g_prizeval') : '' }));
  goodPrizeNotice();
}
function goodPrizeNotice() {
  const g = S.goodWords.summary.find(x => x.name === val('g_who'));
  const next = (g ? g.count : 0) + 1;
  $('#g_prize').innerHTML = next % S.goodWords.perPrize === 0 ? `<div class="notice">🎁 This is good word #${next} — it comes with a prize.
      <label>Prize</label><input id="g_prizeval" placeholder="Pizza night of your choice"></div>` : '';
}

function editUser(name) {
  const u = S.users.find(x => x.name === name) || { name:'', email:'', phone:'', role:'member', allowance:0 };
  form(name ? 'Edit ' + esc(name) : 'Add member', `
    ${name ? '' : '<label>Name (used in rotations, cannot be changed later)</label><input id="u_name">'}
    <label>Role</label><select id="u_role"><option value="member">Member</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option></select>
    <label>Phone (for the 💬 WhatsApp buttons)</label><input id="u_phone" type="tel" placeholder="054-1234567" value="${esc(u.phone || '')}">
    <label>Monthly allowance (₪, paid on the 1st)</label><input id="u_allow" type="number" min="0" step="1" value="${u.allowance}">
    <label>Email (optional)</label><input id="u_email" type="email" value="${esc(u.email)}">`,
    () => call('adminSaveUser', {
      existing: name || '', name: name ? name : val('u_name'), role: val('u_role'), email: val('u_email'),
      phone: val('u_phone'), allowance: val('u_allow'),
    }));
}

/** Opens the phone's share sheet with that member's link; falls back to copying it. */
let LINKS = [];
function shareLink(i) {
  const l = LINKS[i];
  const text = `${l.name}, your Family Hub link: ${l.url}`;
  if (navigator.share) {
    navigator.share({ title: 'Family Hub', text: text }).catch(() => {});
  } else {
    $('#link-' + i).select();
    try { navigator.clipboard.writeText(l.url).then(() => toast('Link copied')); } catch (e) { toast('Select the link and copy it'); }
  }
}
function showLinks() {
  EDITING = true;
  call('adminGetLinks').then(links => {
    LINKS = links;
    $('#view').innerHTML = `<h2>Personal links</h2><div class="card muted">Each link logs that person in — share it only with them. On the phone: open it, then “Add to Home Screen”.</div>` +
      links.map((l, i) => `<div class="card"><b>${esc(l.name)}</b><input id="link-${i}" readonly value="${esc(l.url)}" onclick="this.select()" style="margin-top:6px">
        <div class="actions">${waBtn(l.name, `${l.name}, your Family Hub link: ${l.url}`, 'Send on WhatsApp')}
          <button class="btn sec small" onclick="shareLink(${i})">Share…</button></div></div>`).join('') +
      `<button class="btn sec" onclick="go('admin')">Back</button>`;
  });
}

// ---------- boot ----------
// The personal link is …/#u=<token>. Remember it so the home-screen icon keeps
// working even if the phone drops the #fragment.
(function boot() {
  const fromLink = new URLSearchParams(location.hash.slice(1)).get('u');
  let saved = '';
  try { saved = localStorage.getItem('familyHubToken') || ''; } catch (e) {}
  TOKEN = fromLink || saved;
  if (fromLink) { try { localStorage.setItem('familyHubToken', fromLink); } catch (e) {} }
  if (!window.FAMILY_HUB_API) { $('#view').innerHTML = '<div class="card">The app is not configured yet (config.js).</div>'; return; }
  if (!TOKEN) { $('#view').innerHTML = '<div class="card">This page needs your personal link. Ask Mom or Dad for it.</div>'; return; }
  load();
  setInterval(load, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
